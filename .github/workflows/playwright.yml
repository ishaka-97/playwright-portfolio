name: Tests Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
  schedule:
    - cron: '0 6 * * 1'     # chaque lundi à 6h UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage TypeScript
        run: npm run typecheck

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Lancer les tests
        run: npx playwright test

      - name: Sauvegarder le rapport (artefact téléchargeable)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Préparer le rapport pour GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le rapport sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5